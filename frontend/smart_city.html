<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicPulse AI - 3D Smart City</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050b18;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #city-container {
            width: 100%;
            height: 650px;
            position: relative;
        }

        #city-container canvas {
            display: block;
        }

        #heading {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 5;
            color: #00eaff;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 0 0 15px #00bfff;
            pointer-events: none;
        }

        #message {
            position: absolute;
            bottom: 15px;
            left: 20px;
            color: #9beeff;
            font-size: 13px;
            z-index: 5;
            pointer-events: none;
        }

        #error {
            color: #ff7777;
            padding: 20px;
            display: none;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>
    <div id="city-container">
        <div id="heading">CIVICPULSE AI | SMART CITY</div>
        <div id="message">Drag to rotate • Scroll to zoom</div>
        <div id="error"></div>
    </div>

    <script type="module">
        try {
            const THREE = await import("three");

            const { OrbitControls } = await import(
                "three/addons/controls/OrbitControls.js"
            );

            const container = document.getElementById("city-container");

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050b18);
            scene.fog = new THREE.Fog(0x050b18, 45, 120);

            const camera = new THREE.PerspectiveCamera(
                55,
                container.clientWidth / container.clientHeight,
                0.1,
                300
            );

            camera.position.set(32, 28, 38);

            const renderer = new THREE.WebGLRenderer({
                antialias: true
            });

            renderer.setSize(
                container.clientWidth,
                container.clientHeight
            );

            renderer.setPixelRatio(
                Math.min(window.devicePixelRatio, 2)
            );

            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            container.appendChild(renderer.domElement);

            const controls = new OrbitControls(
                camera,
                renderer.domElement
            );

            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2.05;
            controls.minDistance = 15;
            controls.maxDistance = 90;

            // Lighting
            scene.add(
                new THREE.AmbientLight(0x8abfff, 1.5)
            );

            const light = new THREE.DirectionalLight(
                0xffffff,
                2
            );

            light.position.set(20, 40, 20);
            light.castShadow = true;
            scene.add(light);

            // Ground
            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(120, 120),
                new THREE.MeshStandardMaterial({
                    color: 0x101c30,
                    roughness: 0.85
                })
            );

            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.1;
            ground.receiveShadow = true;
            scene.add(ground);

            // City grid
            const grid = new THREE.GridHelper(
                120,
                60,
                0x087caa,
                0x183650
            );

            grid.position.y = 0.02;
            scene.add(grid);

            // Roads
            function createRoad(x, z, width, depth) {
                const road = new THREE.Mesh(
                    new THREE.BoxGeometry(width, 0.12, depth),
                    new THREE.MeshStandardMaterial({
                        color: 0x17283b,
                        roughness: 0.8
                    })
                );

                road.position.set(x, 0.05, z);
                scene.add(road);
            }

            createRoad(0, 0, 120, 9);
            createRoad(0, 0, 9, 120);
            createRoad(0, 25, 120, 5);
            createRoad(25, 0, 5, 120);

            // Road markings
            const markingMaterial = new THREE.MeshBasicMaterial({
                color: 0x00dfff
            });

            for (let i = -50; i <= 50; i += 8) {
                const marking = new THREE.Mesh(
                    new THREE.BoxGeometry(2.5, 0.04, 0.18),
                    markingMaterial
                );

                marking.position.set(i, 0.14, 0);
                scene.add(marking);
            }

            // Buildings
            const buildingMaterial = new THREE.MeshStandardMaterial({
                color: 0x153b64,
                metalness: 0.55,
                roughness: 0.3
            });

            const windowMaterial = new THREE.MeshBasicMaterial({
                color: 0x00dfff
            });

            function createBuilding(x, z, width, height, depth) {
                const building = new THREE.Mesh(
                    new THREE.BoxGeometry(width, height, depth),
                    buildingMaterial.clone()
                );

                building.position.set(
                    x,
                    height / 2,
                    z
                );

                building.castShadow = true;
                building.receiveShadow = true;
                scene.add(building);

                // Glowing windows on the front
                for (
                    let y = 2;
                    y < height - 1;
                    y += 3
                ) {
                    for (
                        let wx = -width / 2 + 1;
                        wx < width / 2 - 0.5;
                        wx += 2
                    ) {
                        const windowMesh = new THREE.Mesh(
                            new THREE.BoxGeometry(0.7, 1, 0.08),
                            windowMaterial
                        );

                        windowMesh.position.set(
                            x + wx,
                            y,
                            z + depth / 2 + 0.05
                        );

                        scene.add(windowMesh);
                    }
                }
            }

            const buildings = [
                [-18, -18, 7, 19, 7],
                [-30, -12, 8, 29, 8],
                [-40, -28, 7, 15, 7],
                [18, -18, 8, 26, 8],
                [32, -15, 7, 17, 7],
                [43, -30, 8, 32, 8],
                [-18, 18, 8, 23, 8],
                [-35, 32, 7, 30, 7],
                [18, 18, 7, 16, 7],
                [35, 35, 9, 25, 9],
                [-48, 10, 8, 20, 8],
                [48, 8, 7, 18, 7]
            ];

            buildings.forEach(building => {
                createBuilding(...building);
            });

            // Central civic building
            const civicBuilding = new THREE.Mesh(
                new THREE.BoxGeometry(12, 10, 12),
                new THREE.MeshStandardMaterial({
                    color: 0x087b9c,
                    metalness: 0.7,
                    roughness: 0.25
                })
            );

            civicBuilding.position.set(0, 5, 17);
            scene.add(civicBuilding);

            // Glowing central marker
            const marker = new THREE.Mesh(
                new THREE.SphereGeometry(1.2, 24, 24),
                new THREE.MeshBasicMaterial({
                    color: 0x00ffff
                })
            );

            marker.position.set(0, 13, 17);
            scene.add(marker);

            // Animation
            function animate() {
                requestAnimationFrame(animate);

                marker.position.y =
                    13 + Math.sin(Date.now() * 0.002) * 0.6;

                controls.update();
                renderer.render(scene, camera);
            }

            animate();

            // Resize
            window.addEventListener("resize", () => {
                camera.aspect =
                    container.clientWidth /
                    container.clientHeight;

                camera.updateProjectionMatrix();

                renderer.setSize(
                    container.clientWidth,
                    container.clientHeight
                );
            });

        } catch (error) {
            const errorBox = document.getElementById("error");
            errorBox.style.display = "block";
            errorBox.textContent =
                "3D loading error: " + error.message;
            console.error(error);
        }
    </script>
</body>
</html>
